const K='empiricardo_v1';let data;try{data=JSON.parse(localStorage.getItem(K)||'null')}catch(e){};if(!data)data={clients:[],machines:[{id:'nissan-a201',brand:'Nissan',model:'A201',serial:'',hours:'2179',type:'Por confirmar',client:'',notes:'Mensagem TRUCK MODE: SELECT; PROBLEM 146 (a confirmar). Diagnóstico pendente.'}],jobs:[],docs:[]};let page='home',current='nissan-a201';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(K,JSON.stringify(data));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const machine=id=>data.machines.find(x=>x.id===id);const client=id=>data.clients.find(x=>x.id===id);function go(p,id){page=p;if(id)current=id;render();window.scrollTo(0,0)}
const dbp=new Promise((resolve,reject)=>{let r=indexedDB.open('empiricardo_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});async function putFile(id,blob){let db=await dbp;return new Promise((res,rej)=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function getFile(id){let db=await dbp;return new Promise((res,rej)=>{let r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function removeFile(id){let db=await dbp;return new Promise(res=>{let t=db.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=res})}
function render(){const names={home:'Início',clients:'Clientes',machines:'Máquinas',library:'Biblioteca'};$('nav').innerHTML=Object.entries(names).map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${({home:'⌂',clients:'♙',machines:'🚜',library:'▤'})[id]}<br>${label}</button>`).join('');let h='';if(page==='home'){h=`<div class="notice">⚠️ Os dados ficam neste navegador, não na nuvem. Faz cópias de segurança regularmente. Não uses ainda como arquivo único de documentos importantes.</div><h2>Painel principal</h2><div class="stats"><div class="stat"><strong>${data.clients.length}</strong><span>Clientes</span></div><div class="stat"><strong>${data.machines.length}</strong><span>Máquinas</span></div><div class="stat"><strong>${data.jobs.length}</strong><span>Intervenções</span></div></div><div class="panel" style="margin-top:13px"><button class="full" onclick="go('machineForm')">+ Registar máquina</button><button class="full secondary" onclick="go('clientForm')">+ Registar cliente</button><button class="full secondary" onclick="go('library')">📚 Biblioteca técnica</button></div><div class="panel"><h3>Máquinas recentes</h3>${data.machines.slice(-5).reverse().map(m=>`<div class="item" onclick="go('detail','${m.id}')"><b>${esc(m.brand)} ${esc(m.model)}</b><small>${esc(m.serial||'Sem número de série')}</small></div>`).join('')}</div><div class="panel"><h3>Cópia de segurança</h3><p class="muted">Exporta todos os registos e ficheiros para um único ficheiro JSON, que podes guardar em Ficheiros ou iCloud Drive.</p><button class="full" onclick="backup()">⬇ Exportar cópia completa</button><label>Restaurar cópia anterior</label><input type="file" accept="application/json,.json" onchange="restore(event)"></div>`}
if(page==='clients')h=`<h2>Clientes</h2><button class="full" onclick="go('clientForm')">+ Novo cliente</button>${data.clients.map(c=>`<div class="panel"><b>${esc(c.name)}</b><p class="muted">${esc(c.phone)} · ${esc(c.address)}</p><small>${data.machines.filter(m=>m.client===c.id).length} máquinas</small></div>`).join('')||'<p class="muted">Ainda não tens clientes.</p>'}`;
if(page==='clientForm')h=`<div class="panel"><h2>Novo cliente</h2><form onsubmit="addClient(event)"><label>Nome *</label><input name="name" required><label>Telefone</label><input name="phone" type="tel"><label>Morada</label><textarea name="address"></textarea><label>Email</label><input name="email" type="email"><button class="full">Guardar cliente</button></form></div>`;
if(page==='machines')h=`<h2>Máquinas</h2><input placeholder="Pesquisar marca, modelo ou série" oninput="filterMachines(this.value)" id="q"><button class="full" onclick="go('machineForm')">+ Nova máquina</button><div id="machineList"></div>`;
if(page==='machineForm')h=`<div class="panel"><h2>Registar máquina</h2><form onsubmit="addMachine(event)"><label>Marca *</label><input name="brand" required placeholder="Nissan, Toyota, Linde..."><label>Modelo *</label><input name="model" required><label>Número de série</label><input name="serial"><label>Horas</label><input name="hours" type="number"><label>Tipo</label><select name="type"><option>Elétrico</option><option>Diesel</option><option>Gás</option><option>Retrátil</option><option>Porta-paletes</option><option>Outro</option></select><label>Cliente</label><select name="client"><option value="">Sem cliente</option>${data.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Notas</label><textarea name="notes"></textarea><button class="full">Guardar máquina</button></form></div>`;
if(page==='detail'){let m=machine(current);if(!m)return go('machines');let docs=data.docs.filter(d=>d.machine===current);h=`<button class="secondary" onclick="go('machines')">← Máquinas</button><h2 style="margin-top:13px">${esc(m.brand)} ${esc(m.model)}</h2><div class="panel"><div class="pill">${esc(m.type)}</div><p><b>Série:</b> ${esc(m.serial||'—')}<br><b>Horas:</b> ${esc(m.hours||'—')}<br><b>Cliente:</b> ${esc(client(m.client)?.name||'—')}</p><p class="muted">${esc(m.notes)}</p></div><div class="panel"><h3>📸 Fotografias, prints e PDFs</h3><button class="full" onclick="go('upload')">+ Adicionar ficheiro</button>${docs.map(fileRow).join('')||'<p class="muted">Sem documentos associados.</p>'}</div><div class="panel"><h3>🔧 Intervenções</h3><button class="full secondary" onclick="go('jobForm')">+ Registar avaria / reparação</button>${data.jobs.filter(j=>j.machine===current).slice().reverse().map(j=>`<div class="item"><b>${esc(j.date)} — ${esc(j.error||'Intervenção')}</b><small>${esc(j.problem)}<br>${esc(j.work)}<br>Peças: ${esc(j.parts)}</small></div>`).join('')||'<p class="muted">Sem intervenções.</p>'}</div>`}
if(page==='jobForm')h=`<div class="panel"><h2>Nova intervenção</h2><form onsubmit="addJob(event)"><label>Data</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required><label>Código de erro</label><input name="error" placeholder="Ex.: 146"><label>Problema / avaria</label><textarea name="problem" required></textarea><label>Trabalho realizado</label><textarea name="work"></textarea><label>Peças e referências</label><textarea name="parts"></textarea><button class="full">Guardar intervenção</button></form></div>`;
if(page==='library'){let brands=[...new Set(data.machines.map(m=>m.brand).concat(data.docs.map(d=>d.brand)).filter(Boolean))].sort();h=`<h2>Biblioteca técnica</h2><p class="muted">Manuais, esquemas, fotografias e prints organizados por marca e modelo.</p><button class="full" onclick="go('upload')">+ Adicionar manual, PDF ou print</button><label>Pesquisar por marca, modelo, erro ou ficheiro</label><input id="docq" oninput="filterDocs(this.value)" placeholder="Ex.: Nissan A201, 146..."><div id="doclist"></div><p class="muted">Marcas registadas: ${brands.map(esc).join(', ')||'Nenhuma'}</p>`}
if(page==='upload'){let m=machine(current);h=`<div class="panel"><h2>Adicionar ficheiro</h2><form onsubmit="upload(event)"><label>Marca *</label><input name="brand" required value="${esc(page==='upload'&&m?m.brand:'')}"><label>Modelo *</label><input name="model" required value="${esc(page==='upload'&&m?m.model:'')}"><label>Categoria</label><select name="category"><option>Print / código de erro</option><option>Fotografia</option><option>Manual PDF</option><option>Esquema elétrico</option><option>Esquema hidráulico</option><option>Outro documento</option></select><label>Código de erro (opcional)</label><input name="error" placeholder="Ex.: 146"><label>Descrição</label><textarea name="description" placeholder="Notas e diagnóstico"></textarea><label>Associar à máquina</label><select name="machine"><option value="">Apenas biblioteca técnica</option>${data.machines.map(x=>`<option value="${x.id}" ${x.id===current?'selected':''}>${esc(x.brand)} ${esc(x.model)} ${esc(x.serial)}</option>`).join('')}</select><label>Escolher fotografia, print ou PDF *</label><input name="file" type="file" accept="image/*,.pdf,application/pdf" required><button class="full">Guardar ficheiro</button></form><p class="muted">No iPhone, o seletor permite escolher da fototeca ou da app Ficheiros; dependendo do navegador, também tirar uma fotografia.</p></div>`}
$('main').innerHTML=h;if(page==='machines')filterMachines('');if(page==='library')filterDocs('')}
function filterMachines(q){$('machineList').innerHTML=data.machines.filter(m=>[m.brand,m.model,m.serial].join(' ').toLowerCase().includes(q.toLowerCase())).map(m=>`<div class="item" onclick="go('detail','${m.id}')"><b>${esc(m.brand)} ${esc(m.model)}</b><small>Série: ${esc(m.serial||'—')}</small></div>`).join('')||'<p class="muted">Sem resultados.</p>'}
function fileRow(d){return `<div class="fileitem"><div><b>${esc(d.name)}</b><br><small>${esc(d.category)} · ${esc(d.brand)} ${esc(d.model)} ${esc(d.error?'· Erro '+d.error:'')}</small></div><button onclick="openDoc('${d.id}')">Abrir</button></div>`}
function filterDocs(q){$('doclist').innerHTML=data.docs.filter(d=>[d.brand,d.model,d.name,d.error,d.category,d.description].join(' ').toLowerCase().includes(q.toLowerCase())).map(d=>`<div class="panel"><b>${esc(d.brand)} → ${esc(d.model)}</b>${fileRow(d)}<small>${esc(d.description)}</small></div>`).join('')||'<div class="panel"><p class="muted">Ainda não tens documentos guardados. Podes começar por adicionar um print ou manual.</p></div>'}
function vals(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}function addClient(e){let x=vals(e);data.clients.push({...x,id:uid()});save();go('clients')}function addMachine(e){let x=vals(e);data.machines.push({...x,id:uid()});save();go('machines')}function addJob(e){let x=vals(e);data.jobs.push({...x,id:uid(),machine:current});save();go('detail')}
async function upload(e){e.preventDefault();let form=e.target, x=Object.fromEntries(new FormData(form).entries()),f=x.file;if(!f||!f.size)return alert('Escolhe um ficheiro.');if(f.size>18*1024*1024)return alert('Para esta versão, escolhe um ficheiro até 18 MB.');let id=uid();try{await putFile(id,f);delete x.file;data.docs.push({...x,id,name:f.name,mime:f.type,size:f.size});save();alert('Ficheiro guardado neste navegador. Faz uma cópia de segurança!');go(x.machine?'detail':'library')}catch(err){alert('Não foi possível guardar o ficheiro. Espaço insuficiente ou armazenamento bloqueado.')}}
async function openDoc(id){let f=await getFile(id);if(!f)return alert('Ficheiro não encontrado. Restaura uma cópia de segurança.');let url=URL.createObjectURL(f);let a=document.createElement('a');a.href=url;a.target='_blank';a.download=data.docs.find(d=>d.id===id)?.name||'ficheiro';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
const blobToData=blob=>new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)});async function backup(){try{let files={};for(let d of data.docs){let f=await getFile(d.id);if(f)files[d.id]=await blobToData(f)}let payload={version:1,exported:new Date().toISOString(),data,files};let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='empiricardo-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}catch(e){alert('Erro ao criar a cópia de segurança.')}}
async function restore(e){let f=e.target.files[0];if(!f)return;if(!confirm('Substituir os registos atuais pelos da cópia?'))return;try{let b=JSON.parse(await f.text());if(!b.data||!Array.isArray(b.data.machines)||!Array.isArray(b.data.docs))throw Error('Formato inválido');for(let [id,uri] of Object.entries(b.files||{})){let blob=await(await fetch(uri)).blob();await putFile(id,blob)}data=b.data;save();go('home');alert('Cópia restaurada.')}catch(err){alert('Não foi possível restaurar esta cópia.')}}
async function seed(){if(localStorage.getItem('empiricardo_seeded'))return;try{let b=await(await fetch(SAMPLE)).blob();let id='nissan-painel-exemplo';await putFile(id,b);data.docs.push({id,brand:'Nissan',model:'A201',category:'Print / código de erro',error:'146 (a confirmar)',description:'Fotografia do painel. Mensagem TRUCK MODE: SELECT. Diagnóstico não confirmado.',machine:'nissan-a201',name:'painel_nissan_a201.jpg',mime:'image/jpeg',size:b.size});save();localStorage.setItem('empiricardo_seeded','1');render()}catch(e){}}render();seed();
</script></body></html>

function filterMachines(q){$('machineList').innerHTML=data.machines.filter(m=>[m.brand,m.model,m.serial].join(' ').toLowerCase().includes(q.toLowerCase())).map(m=>`<div class="item" onclick="go('detail','${m.id}')"><b>${esc(m.brand)} ${esc(m.model)}</b><small>Série: ${esc(m.serial||'—')}</small></div>`).join('')||'<p class="muted">Sem resultados.</p>'}
function fileRow(d){return `<div class="fileitem"><div><b>${esc(d.name)}</b><br><small>${esc(d.category)} · ${esc(d.brand)} ${esc(d.model)} ${esc(d.error?'· Erro '+d.error:'')}</small></div><button onclick="openDoc('${d.id}')">Abrir</button></div>`}
function filterDocs(q){$('doclist').innerHTML=data.docs.filter(d=>[d.brand,d.model,d.name,d.error,d.category,d.description].join(' ').toLowerCase().includes(q.toLowerCase())).map(d=>`<div class="panel"><b>${esc(d.brand)} → ${esc(d.model)}</b>${fileRow(d)}<small>${esc(d.description)}</small></div>`).join('')||'<div class="panel"><p class="muted">Ainda não tens documentos guardados. Podes começar por adicionar um print ou manual.</p></div>'}
function vals(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}function addClient(e){let x=vals(e);data.clients.push({...x,id:uid()});save();go('clients')}function addMachine(e){let x=vals(e);data.machines.push({...x,id:uid()});save();go('machines')}function addJob(e){let x=vals(e);x.materials=parseMaterials(x.materialsText);delete x.materialsText;data.jobs.push({...x,id:uid(),machine:current});save();go('detail')}
async function upload(e){e.preventDefault();let form=e.target, x=Object.fromEntries(new FormData(form).entries()),f=x.file;if(!f||!f.size)return alert('Escolhe um ficheiro.');if(f.size>18*1024*1024)return alert('Para esta versão, escolhe um ficheiro até 18 MB.');let id=uid();try{await putFile(id,f);delete x.file;data.docs.push({...x,id,name:f.name,mime:f.type,size:f.size});save();alert('Ficheiro guardado neste navegador. Faz uma cópia de segurança!');go(x.machine?'detail':'library')}catch(err){alert('Não foi possível guardar o ficheiro. Espaço insuficiente ou armazenamento bloqueado.')}}
async function openDoc(id){let f=await getFile(id);if(!f)return alert('Ficheiro não encontrado. Restaura uma cópia de segurança.');let url=URL.createObjectURL(f);let a=document.createElement('a');a.href=url;a.target='_blank';a.download=data.docs.find(d=>d.id===id)?.name||'ficheiro';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
const blobToData=blob=>new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)});async function backup(){try{let files={};for(let d of data.docs){let f=await getFile(d.id);if(f)files[d.id]=await blobToData(f)}let payload={version:1,exported:new Date().toISOString(),data,files};let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='empiricardo-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}catch(e){alert('Erro ao criar a cópia de segurança.')}}
async function restore(e){let f=e.target.files[0];if(!f)return;if(!confirm('Substituir os registos atuais pelos da cópia?'))return;try{let b=JSON.parse(await f.text());if(!b.data||!Array.isArray(b.data.machines)||!Array.isArray(b.data.docs))throw Error('Formato inválido');for(let [id,uri] of Object.entries(b.files||{})){let blob=await(await fetch(uri)).blob();await putFile(id,blob)}data=b.data;save();go('home');alert('Cópia restaurada.')}catch(err){alert('Não foi possível restaurar esta cópia.')}}

const SUPABASE_URL='https://dxootqkcxdaoczzpllrh.supabase.co';
const SUPABASE_KEY='sb_publishable_5t300ppktLW63vaC2-EefA_JtF7MdHl';
let cloudSession=null,cloudTimer=null,cloudBusy=false;
try{cloudSession=JSON.parse(localStorage.getItem('empiricardo_cloud_session')||'null')}catch(e){}
function parseMaterials(t){return String(t||'').split('\n').filter(x=>x.trim()).map(line=>{let a=line.split('|').map(v=>v.trim());return {description:a[0]||'',quantity:a[1]||'1',reference:a[2]||'',price:a[3]||''}})}
function materialsText(a){return (a||[]).map(m=>[m.description,m.quantity,m.reference,m.price].join(' | ')).join('\n')}
function editMachine(id){let m=machine(id);if(!m)return;let f=['brand','model','serial','hours','type','notes'];for(let k of f){let v=prompt('Editar '+k,m[k]||'');if(v===null)return;m[k]=v}let c=prompt('ID do cliente (vazio = sem cliente)',m.client||'');if(c===null)return;m.client=c;save();go('detail',id)}
function deleteMachine(id){let n=data.jobs.filter(j=>j.machine===id).length,d=data.docs.filter(x=>x.machine===id).length;if(!confirm('Eliminar esta máquina? Existem '+n+' intervenções e '+d+' documentos associados. Estes serão conservados, mas deixarão de aparecer na ficha da máquina.'))return;data.machines=data.machines.filter(m=>m.id!==id);save();go('machines')}
function editJob(id){let j=data.jobs.find(x=>x.id===id);if(!j)return;for(let k of ['date','error','problem','work','parts']){let v=prompt('Editar '+k,j[k]||'');if(v===null)return;j[k]=v}let v=prompt('Materiais (descrição | quantidade | referência | preço, um por linha)',materialsText(j.materials));if(v===null)return;j.materials=parseMaterials(v);save();go('detail')}
function deleteJob(id){if(!confirm('Eliminar esta intervenção definitivamente?'))return;data.jobs=data.jobs.filter(j=>j.id!==id);save();go('detail')}
function printJob(id){let j=data.jobs.find(x=>x.id===id),m=machine(j?.machine);if(!j)return;let w=window.open('','_blank');if(!w)return alert('Permite janelas pop-up para criar o relatório.');let rows=(j.materials||[]).map(a=>'<tr><td>'+esc(a.description)+'</td><td>'+esc(a.quantity)+'</td><td>'+esc(a.reference)+'</td><td>'+esc(a.price)+'</td></tr>').join('');w.document.write('<!doctype html><html lang="pt"><meta charset="utf-8"><title>Relatório Empiricardo</title><style>body{font:15px Arial;padding:25px;color:#111}h1{border-bottom:3px solid #e9a826}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:8px}.sign{margin-top:65px;border-top:1px solid #333;width:270px;padding-top:8px}@media print{button{display:none}}</style><h1>Empiricardo — Relatório de intervenção</h1><p><b>Máquina:</b> '+esc((m?.brand||'')+' '+(m?.model||''))+'<br><b>Série:</b> '+esc(m?.serial||'')+'<br><b>Data:</b> '+esc(j.date)+'</p><p><b>Código de erro:</b> '+esc(j.error)+'</p><h3>Problema</h3><p>'+esc(j.problem)+'</p><h3>Trabalho realizado</h3><p>'+esc(j.work)+'</p><h3>Materiais</h3><table><tr><th>Descrição</th><th>Qtd.</th><th>Referência</th><th>Preço (€)</th></tr>'+rows+'</table><h3>Checklist</h3><p>'+[['checkVisual','Inspeção visual'],['checkHydraulic','Sistema hidráulico'],['checkBrakes','Travões e direção'],['checkBattery','Bateria / combustível'],['checkSafety','Segurança']].map(([k,n])=>(j[k]?'☑':'☐')+' '+n).join('<br>')+'</p><div class="sign">Assinatura do cliente / técnico</div><p><button onclick="window.print()">Imprimir / Guardar PDF</button></p></html>');w.document.close()}
async function cloudRequest(path,opts={}){let headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...opts.headers};if(cloudSession?.access_token)headers.Authorization='Bearer '+cloudSession.access_token;let r=await fetch(SUPABASE_URL+path,{...opts,headers});let t=await r.text(),v;try{v=JSON.parse(t)}catch(e){v=t}if(!r.ok)throw Error(v.msg||v.message||v.error_description||'Erro '+r.status);return v}
function updateCloudStatus(){let el=$('cloudStatus');if(el)el.textContent=cloudSession?'Sessão iniciada. Registos prontos para sincronizar.':'Sem sessão iniciada. Os registos continuam guardados neste iPhone.'}
async function cloudLogin(e){e.preventDefault();let f=new FormData(e.target);try{let s=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});cloudSession=s;localStorage.setItem('empiricardo_cloud_session',JSON.stringify(s));e.target.reset();updateCloudStatus();alert('Sessão iniciada. Carrega em Guardar registos na nuvem para fazer a primeira sincronização.')}catch(err){alert('Não foi possível entrar: '+err.message)}}
function cloudLogout(){cloudSession=null;localStorage.removeItem('empiricardo_cloud_session');updateCloudStatus()}
function queueCloudSave(){if(!cloudSession)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudPush(false),1600)}
async function cloudPush(show){if(!cloudSession){if(show)alert('Primeiro inicia sessão.');return}if(cloudBusy)return;cloudBusy=true;try{await cloudRequest('/rest/v1/app_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:cloudSession.user.id,content:data,updated_at:new Date().toISOString()})});if(show)alert('Registos guardados na nuvem. Fotografias e PDFs continuam apenas no iPhone.')}catch(err){if(show)alert('Erro na sincronização: '+err.message);else console.warn('Falha na sincronização:',err)}finally{cloudBusy=false}}
async function cloudPull(){if(!cloudSession)return alert('Primeiro inicia sessão.');if(!confirm('Atenção: os registos na nuvem vão substituir os registos deste iPhone. Exporta uma cópia de segurança antes de continuar. Continuar?'))return;try{let a=await cloudRequest('/rest/v1/app_data?select=content&user_id=eq.'+encodeURIComponent(cloudSession.user.id));if(!a.length)return alert('Ainda não existem registos na nuvem. Usa Guardar registos na nuvem primeiro.');let v=a[0].content;if(!Array.isArray(v.machines)||!Array.isArray(v.jobs)||!Array.isArray(v.docs))throw Error('Dados inválidos');data=v;localStorage.setItem(K,JSON.stringify(data));go('home');alert('Registos recuperados. Os ficheiros anexados devem ser restaurados com uma cópia completa.')}catch(err){alert('Não foi possível recuperar: '+err.message)}}
